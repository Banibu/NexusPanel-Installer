name: nexus-panel
services:
  nexus-bootstrap:
    image: ghcr.io/banibu/nexus-bootstrap:v1.3.6
    container_name: nexus-bootstrap
    restart: unless-stopped
    privileged: true
    environment:
      NEXUS_PUBLIC_URL: http://localhost:8080
      NEXUS_HTTP_PORT: "8080"
      NEXUS_HTTPS_PORT: "8443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/nexus:/opt/nexus
      - /etc/nexus:/etc/nexus
      - /var/lib/nexus:/var/lib/nexus
      - /var/log/nexus:/var/log/nexus
      - /srv/nexus:/srv/nexus
x-casaos:
  id: org.banibu.nexuspanel
  architectures: [amd64, arm64]
  main: nexus-bootstrap
  author: Banibu
  developer: Banibu
  title:
    en_US: Nexus Panel
    pt_BR: Nexus Panel
  tagline:
    en_US: Infrastructure and application control plane
    pt_BR: Painel de infraestrutura e aplicações
  description:
    en_US: Standalone Nexus Panel bootstrap with secure web onboarding.
    pt_BR: Instalação standalone do Nexus Panel com onboarding web seguro.
  category: Utilities
  port_map: "8080"
  index: /
  version: "1.3.6"
  website: https://github.com/Banibu/NexusPanel-Installer
  repo: https://github.com/Banibu/NexusPanel-Installer
  support: https://github.com/Banibu/NexusPanel-Installer/issues
